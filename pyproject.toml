[project]
name = "sweet-seats-runtime"
version = "0.1.0"
description = "Original Sweet Seats Python API runtime in the Replit workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "psycopg[binary]==3.2.13",
    "pydantic>=2.9,<3.0",
    "pytest>=9.0.3,<10.0",
    "uvicorn>=0.30,<1.0",
]

[tool.uv]
package = false
