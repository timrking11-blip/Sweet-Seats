[project]
name = "sweet-seats-api"
version = "0.1.0"
description = "Server-side API and collection contracts for Sweet Seats"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]==3.2.13",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0", "ruff>=0.8,<1.0", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI declares dependencies through parameter defaults.
ignore = ["B008"]


