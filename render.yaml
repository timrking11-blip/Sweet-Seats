# Render blueprint for Sweet Seats (Build Plan F2; DRAFT, not yet applied).
#
# Nothing here is live. The owner creates the Render services from this file and fills
# every sync: false value in the Render dashboard; no secret is ever committed.
#
# Before this can serve real data, two deliberate changes are needed (owner decisions):
#   1. The API's store accepts only a loopback database URL (local_dsn in
#      services/api/app/discovery_postgres.py) so it can never quietly reach a hosted
#      project. Pointing it at Supabase means lifting that guard on purpose, with tests.
#   2. The alert worker sends through LogTransport, which contacts no one.
#      PostmarkTransport (services/api/app/transports/postmark.py) also needs the
#      endpoint secret store, which is still undecided.
# Until then the API runs on the synthetic demo data, as on Replit.

envVarGroups:
  - name: sweet-seats-secrets
    envVars:
      - key: SWEET_SEATS_LOCAL_DATABASE_URL       # Supabase pooled URL (see note 1)
        sync: false
      - key: SWEET_SEATS_SUPABASE_JWT_SECRET
        sync: false
      - key: SWEET_SEATS_SUPABASE_ISSUER          # https://<project>.supabase.co/auth/v1
        sync: false
      - key: SWEET_SEATS_POSTMARK_SERVER_TOKEN
        sync: false
      - key: SWEET_SEATS_POSTMARK_FROM
        sync: false
      - key: SWEET_SEATS_POSTMARK_WEBHOOK_USER
        sync: false
      - key: SWEET_SEATS_POSTMARK_WEBHOOK_PASSWORD
        sync: false

services:
  # Express serves /api and runs the FastAPI service beside it over a Unix socket.
  - type: web
    name: sweet-seats-api
    runtime: node
    plan: starter
    region: virginia
    buildCommand: >-
      pip install --user uv && export PATH="$HOME/.local/bin:$PATH" &&
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter ./artifacts/api-server run build
    startCommand: export PATH="$HOME/.local/bin:$PATH" && pnpm --filter ./artifacts/api-server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PYTHON_VERSION
        value: "3.12"
      - fromGroup: sweet-seats-secrets

  # The discovery web app and the coming-soon page are static builds that rewrite /api.
  - type: web
    name: sweet-seats-web
    runtime: static
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ pnpm --filter ./artifacts/sweet-seats run build
    staticPublishPath: artifacts/sweet-seats/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sweet-seats-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sweet-seats-coming-soon
    runtime: static
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ pnpm --filter ./artifacts/sweet-seats-coming-soon run build
    staticPublishPath: artifacts/sweet-seats-coming-soon/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sweet-seats-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # One alert worker tick every 5 minutes: plan, reconcile, dispatch (app.alerts --once).
  - type: cron
    name: sweet-seats-alerts
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run --frozen python -m services.api.app.alerts --once
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - fromGroup: sweet-seats-secrets
