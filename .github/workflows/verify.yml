name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research-contract:
    name: Research contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q adapters jobs services tests

  api:
    name: API contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: API runtime and development dependency audit
        run: python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip
      - run: ruff check .
      - run: pytest -q

  database:
    name: Database permissions
    runs-on: ubuntu-latest
    services:
      postgres:
        # Disposable CI container; never a Supabase project or shared database.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Emulate Supabase API roles
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/ci/emulate_supabase_roles.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/ci/emulate_supabase_auth.sql
      - name: Apply migrations
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Permission and RLS tests
        run: |
          for f in supabase/tests/*.sql; do
            echo "Running $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r services/api/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./services/api
      - name: PostgreSQL persistence and API acceptance
        env:
          SWEET_SEATS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m pytest services/api/tests -q
      - name: Negative controls (tests must catch deliberate breakage)
        run: bash supabase/ci/negative_controls.sh

  web:
    name: Web PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: All dependency audit (including development; no exceptions)
        run: npm audit --audit-level=low
      - run: npm run test:lint-glob
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check built client secret boundary
        working-directory: .
        run: python -m unittest tests.test_frontend_boundary -v



